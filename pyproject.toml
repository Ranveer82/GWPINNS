[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwpinns"
version = "0.1.0"
description = "Inverse Physics-Informed Neural Networks for 3D transient groundwater flow across a fault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
benchmark = ["flopy>=3.4"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["gwpinns*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
