[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gwpinn"
version = "0.1.0"
description = "Physics-informed neural network for groundwater head and heterogeneous aquifer property inversion"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "flopy>=3.7",
    "gstools>=1.5",
    "tabulate>=0.9",
    "geopandas>=0.13",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.5",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["gwpinn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
